services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-server-dev
    volumes:
      - .:/app
      - target_cache:/app/target
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    ports:
      - "3000:3000"
    working_dir: /app
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: ["sleep", "infinity"]

volumes:
  target_cache:
  cargo_cache:
  cargo_git:
