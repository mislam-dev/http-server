services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-server
    volumes:
      - .:/app
      - target_cache:/app/target
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    ports:
      - "3000:3000"
    working_dir: /app
    tty: true
    command: cargo watch -c -w src -d 0.1 -x run

volumes:
  target_cache:
  cargo_cache:
  cargo_git:
